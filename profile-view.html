<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<title>Profile — Jain Vivah</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  .pv-back { display: inline-block; margin-bottom: 14px; font-size: 14px; font-weight: 600; text-decoration: none; color: var(--maroon); }
  .pv-photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .pv-photo-item { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 1; background: var(--border); }
  .pv-photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .pv-photo-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #8a7a6d; font-size: 12px; text-align: center; padding: 8px; }
  .pv-name { margin-bottom: 2px; }
  .pv-code { font-size: 13px; color: #8a7a6d; margin-bottom: 16px; }
  .pv-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .pv-row:last-child { border-bottom: none; }
  .pv-row .pv-label { color: #6b5a4e; font-weight: 600; }
  .pv-row .pv-value { color: var(--charcoal); text-align: right; max-width: 60%; }
  .pv-loading, .pv-notfound { text-align: center; padding: 40px 10px; color: #8a7a6d; }
  .pv-interest-actions { display: flex; gap: 10px; margin-top: 12px; }
  .pv-interest-actions .mt-btn { width: auto; flex: 1; }
  .pv-photo-item img { cursor: zoom-in; }
  .pv-lightbox {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.9); align-items: center; justify-content: center;
    padding: 20px; cursor: zoom-out;
  }
  .pv-lightbox.open { display: flex; }
  .pv-lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
</style>
</head>
<body>

<div class="mt-invocation-strip">🙏 || Jai Jinendra || 🙏</div>

<div class="mt-header">
  <button type="button" class="mt-header-logout" onclick="logout()">Logout</button>
  <div class="mt-logo">Jain Vivah</div>
</div>

<div class="mt-page">

  <a class="pv-back" id="pv-back-link" href="browse.html">&larr; Back to Browse</a>

  <div id="pv-content">
    <p class="pv-loading">Loading profile...</p>
  </div>

</div>

<div class="pv-lightbox" id="pv-lightbox" onclick="this.classList.remove('open')">
  <img id="pv-lightbox-img" src="" alt="Full-size photo">
</div>

<div class="mt-footer" id="pv-footer">
  <div id="pv-footer-links"><a href="myprofile.html">My Profile</a> · <a href="interests.html">My Interests</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></div>
  <div class="mt-brand">AnyApps.in</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="profile-shared.js"></script>
<script>
  const PHOTOS_BUCKET_PV = "mt-photos";

  // Draws the signed-url photo onto a canvas with a repeating diagonal
  // watermark carrying the VIEWER's own profile code + today's date, so a
  // leaked/misused photo can always be traced back to who viewed it. Falls
  // back to the plain signed URL if canvas export fails for any reason
  // (e.g. a CORS edge case) rather than showing a broken image.
  function watermarkPhoto(url, stampText) {
    return new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        try {
          const canvas = document.createElement("canvas");
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0);

          ctx.save();
          ctx.translate(canvas.width / 2, canvas.height / 2);
          ctx.rotate(-Math.PI / 7);
          ctx.font = Math.max(14, Math.round(canvas.width / 16)) + "px sans-serif";
          ctx.textAlign = "center";
          ctx.lineWidth = 3;
          ctx.strokeStyle = "rgba(0,0,0,0.35)";
          ctx.fillStyle = "rgba(255,255,255,0.65)";

          const stepY = Math.max(60, canvas.height / 4);
          for (let y = -canvas.height; y < canvas.height * 1.5; y += stepY) {
            ctx.strokeText(stampText, 0, y);
            ctx.fillText(stampText, 0, y);
          }
          ctx.restore();

          resolve(canvas.toDataURL("image/jpeg", 0.9));
        } catch (e) {
          resolve(url);
        }
      };
      img.onerror = () => resolve(url);
      img.src = url;
    });
  }

  function row(label, value, forceShow) {
    if (!value) {
      if (!forceShow) return "";
      value = "Not provided";
    }
    return (
      '<div class="pv-row"><div class="pv-label">' + escapeHtml(label) + '</div>' +
      '<div class="pv-value">' + escapeHtml(value) + "</div></div>"
    );
  }

  async function loadProfileView() {
    const session = await requireAuth();
    if (!session) return;

    const { data: myContact } = await supabaseClient
      .from("mt_contacts")
      .select("mobile, mobile_verified")
      .eq("user_id", session.user.id)
      .maybeSingle();

    const viewerIsAdmin = await isAdmin();

    if ((!myContact || !myContact.mobile_verified) && !viewerIsAdmin) {
      queueToast("Please verify your mobile number on WhatsApp before viewing other profiles.", "info");
      window.location.href = "myprofile.html";
      return;
    }

    const params = new URLSearchParams(location.search);
    const targetId = params.get("id");
    const contentEl = document.getElementById("pv-content");

    if (!targetId) {
      contentEl.innerHTML = '<p class="pv-notfound">No profile specified.</p>';
      return;
    }

    // My own mobile number is the identity stamped onto every photo I view
    // (matches what My Profile's shield-box tells members to expect).
    // Falls back to profile_code, then a short id prefix, only for the
    // edge case of an admin viewing without their own contact/profile row.
    let myCode = myContact && myContact.mobile;
    if (!myCode) {
      const { data: me } = await supabaseClient
        .from("mt_profiles")
        .select("profile_code")
        .eq("user_id", session.user.id)
        .maybeSingle();
      myCode = (me && me.profile_code) || session.user.id.slice(0, 8);
    }

    const { data: profile, error } = await supabaseClient
      .from("mt_profiles")
      .select("*")
      .eq("user_id", targetId)
      .maybeSingle();

    if (error || !profile) {
      contentEl.innerHTML = '<p class="pv-notfound">This profile is not available — it may be inactive, paused, or you may not be eligible to view it yet.</p>';
      return;
    }

    // Fire-and-forget view log — never blocks rendering the profile.
    supabaseClient.from("mt_views").insert({ viewer_id: session.user.id, viewed_id: targetId }).then(() => {});

    const { data: photos } = await supabaseClient
      .from("mt_photos")
      .select("*")
      .eq("user_id", targetId)
      .order("sort_order", { ascending: true });

    const stamp = "Viewed by " + myCode + " · " + new Date().toISOString().slice(0, 10);

    let photosHtml = '<div class="pv-photo-grid">';
    if (photos && photos.length) {
      const urls = await Promise.all(
        photos.map(async (p) => {
          const { data } = await supabaseClient.storage.from(PHOTOS_BUCKET_PV).createSignedUrl(p.storage_path, 90);
          if (!data) return null;
          return watermarkPhoto(data.signedUrl, stamp);
        })
      );
      urls.forEach((dataUrl) => {
        if (!dataUrl) return;
        photosHtml +=
          '<div class="pv-photo-item"><img src="' + dataUrl + '" alt="Profile photo" draggable="false" oncontextmenu="return false"></div>';
      });
    } else {
      photosHtml += '<div class="pv-photo-item"><div class="pv-photo-empty">No photo added</div></div>';
    }
    photosHtml += "</div>";

    const age = calcAge(profile.dob);
    const height = profile.height_cm ? cmToFeet(profile.height_cm) : "";
    const dietLabel = (DIET_OPTIONS.find(([, code]) => code === profile.diet) || [profile.diet])[0];
    const maritalLabel = (MARITAL_STATUS_OPTIONS.find(([, code]) => code === profile.marital_status) || [profile.marital_status])[0];
    const locationText = [profile.city, profile.state, profile.country].filter(Boolean).join(", ");

    contentEl.innerHTML =
      photosHtml +
      '<h1 class="pv-name">' + escapeHtml(profile.full_name || "Member") + "</h1>" +
      '<div class="pv-code">Profile ' + escapeHtml(profile.profile_code || "") + "</div>" +
      '<div class="mt-card">' +
      row("Age", age ? age + " years" : "", viewerIsAdmin) +
      row("Height", height, viewerIsAdmin) +
      row("Marital Status", maritalLabel, viewerIsAdmin) +
      row("Diet", dietLabel, viewerIsAdmin) +
      row("Sect", profile.sect, viewerIsAdmin) +
      row("Location", locationText, viewerIsAdmin) +
      row("Native Place", profile.native_place, viewerIsAdmin) +
      row("Education", profile.education + (profile.education_detail ? " — " + profile.education_detail : ""), viewerIsAdmin) +
      row("Profession", profile.profession + (profile.occupation_detail ? " — " + profile.occupation_detail : ""), viewerIsAdmin) +
      row("Annual Income", profile.annual_income, viewerIsAdmin) +
      row("Hobbies", profile.hobbies, viewerIsAdmin) +
      row("About", profile.about, viewerIsAdmin) +
      "</div>" +
      '<div id="pv-interest-section"></div>';

    contentEl.querySelectorAll(".pv-photo-item img").forEach((img) => {
      img.addEventListener("click", () => {
        document.getElementById("pv-lightbox-img").src = img.src;
        document.getElementById("pv-lightbox").classList.add("open");
      });
    });

    if (viewerIsAdmin) {
      const backLink = document.getElementById("pv-back-link");
      backLink.textContent = "← Back to Admin";
      backLink.href = "admin.html";
      document.getElementById("pv-footer-links").style.display = "none";
    }

    await renderInterestSection(session, targetId, profile, viewerIsAdmin);
  }

  // ---------------- Interest: send / accept / decline / withdraw ----------------
  // One row per (sender, receiver) pair ever exists (mt_interests has a
  // UNIQUE(sender_id, receiver_id) constraint) - so "send" is only ever an
  // INSERT the very first time; every state after that is handled by
  // updating that same row via the RLS-and-trigger-enforced status
  // transitions (see mt_interest_after_update - only the receiver may
  // accept/decline, only the sender may withdraw).
  function friendlyInterestError(message) {
    if (/weekly interest limit/i.test(message)) {
      return "You've reached your weekly interest limit. Please try again in a few days.";
    }
    if (/cannot send another interest/i.test(message)) {
      return "You already reached out to this member recently — please try again later.";
    }
    if (/not allowed/i.test(message)) {
      return "You're not able to send an interest to this member.";
    }
    return message;
  }

  async function renderContactAndBiodata(targetId, targetProfile, headerHtml) {
    const el = document.getElementById("pv-interest-section");

    const { data: contact } = await supabaseClient
      .from("mt_contacts")
      .select("mobile, alt_mobile, email, address")
      .eq("user_id", targetId)
      .maybeSingle();

    let biodataHtml = "";
    const isImageBiodata = targetProfile.biodata_path && /\.(jpe?g|png|webp|gif)$/i.test(targetProfile.biodata_path);
    if (targetProfile.biodata_path) {
      const { data: signed } = await supabaseClient.storage.from(PHOTOS_BUCKET_PV).createSignedUrl(targetProfile.biodata_path, 90);
      if (signed) {
        if (isImageBiodata) {
          biodataHtml =
            '<div class="pv-photo-item" id="pv-biodata-thumb" style="max-width:200px;margin:10px auto;cursor:zoom-in;">' +
            '<img src="' + escapeHtml(signed.signedUrl) + '" alt="Bio-data attachment" style="width:100%;border-radius:10px;">' +
            "</div>" +
            '<p class="mt-center"><a href="' + escapeHtml(signed.signedUrl) + '" target="_blank">Open full-size bio-data image</a></p>';
        } else {
          biodataHtml = '<p class="mt-center">📄 <a href="' + escapeHtml(signed.signedUrl) + '" target="_blank">Download full bio-data (PDF)</a></p>';
        }
      }
    } else {
      biodataHtml = '<p class="mt-center mt-hint">No bio-data document uploaded.</p>';
    }

    el.innerHTML =
      headerHtml +
      '<div class="mt-card">' +
      row("Mobile", contact && contact.mobile, true) +
      row("Alternate Mobile", contact && contact.alt_mobile, true) +
      row("Email", contact && contact.email, true) +
      row("Address", contact && contact.address, true) +
      "</div>" +
      biodataHtml;

    if (isImageBiodata) {
      const thumb = document.getElementById("pv-biodata-thumb");
      thumb.addEventListener("click", () => {
        document.getElementById("pv-lightbox-img").src = thumb.querySelector("img").src;
        document.getElementById("pv-lightbox").classList.add("open");
      });
    }

    return contact;
  }

  // Standard editable reminder sent to members with an incomplete profile.
  // Kept as one place so the wording can be tweaked without touching the
  // send logic below.
  function buildOutreachMessage(profile, missing) {
    const name = profile.full_name || "there";
    const hasBiodata = !!profile.biodata_path;
    const intro = hasBiodata
      ? "Thank you for registering on Jain Vivah and for attaching your bio-data. That's only shown to a match after mutual acceptance though - the fields below are what other members see on your profile FIRST, before they ever decide to send you an interest. Please fill these in directly on your profile:"
      : "Thank you for registering on Jain Vivah. To complete your verification, please fill in the following in your profile:";
    return (
      "Jai Jinendra " + name + ",\n\n" +
      intro + "\n" +
      missing.map((m) => "- " + m).join("\n") +
      "\n\nOnce these are complete, we will verify your profile so you can start browsing matches.\n\nJain Vivah Team"
    );
  }

  // Basic-detail fields are what any browsing member sees BEFORE deciding
  // whether to send an interest - bio-data (PDF/image) only becomes visible
  // AFTER mutual acceptance, same gate as contact details. So bio-data is
  // not a substitute for these: a member who only attaches a PDF and skips
  // these fields is effectively invisible to anyone deciding whether to
  // reach out in the first place, PDF or not. Always check both.
  function computeMissingItems(profile, contact) {
    const checks = [
      [profile.height_cm, "Height"],
      [profile.marital_status, "Marital Status"],
      [profile.diet, "Diet"],
      [profile.sect, "Sect"],
      [profile.city, "City / Location"],
      [profile.native_place, "Native Place"],
      [profile.education, "Education"],
      [profile.profession, "Profession"],
      [profile.annual_income, "Annual Income"],
      [profile.hobbies, "Hobbies"],
      [profile.about, "About"],
      [contact && contact.alt_mobile, "Alternate Mobile"],
      [contact && contact.address, "Address"]
    ];
    const missing = checks.filter(([v]) => !v).map(([, label]) => label);
    if (!profile.biodata_path) {
      missing.push("Bio-data (PDF or photo, with father/mother/siblings/family details)");
    }
    return missing;
  }

  function renderAdminOutreach(targetProfile, contact) {
    const el = document.getElementById("pv-interest-section");
    const missing = computeMissingItems(targetProfile, contact);

    if (!missing.length) {
      el.insertAdjacentHTML("beforeend", '<div class="mt-hint mt-center" style="margin-top:16px;">✅ Profile looks complete.</div>');
      return;
    }

    const message = buildOutreachMessage(targetProfile, missing);
    el.insertAdjacentHTML(
      "beforeend",
      '<div class="mt-card" style="margin-top:16px;">' +
        '<h4 style="margin:0 0 8px;">Missing: ' + escapeHtml(missing.join(", ")) + "</h4>" +
        '<div class="mt-field"><label for="pv-outreach-msg">Message to member (editable)</label>' +
        '<textarea id="pv-outreach-msg" rows="8">' + escapeHtml(message) + "</textarea></div>" +
        '<div class="pv-interest-actions">' +
        (contact && contact.mobile ? '<button type="button" class="mt-btn mt-btn-primary" id="pv-outreach-whatsapp">Send via WhatsApp</button>' : "") +
        (contact && contact.email ? '<button type="button" class="mt-btn mt-btn-outline" id="pv-outreach-email">Send via Email</button>' : "") +
        "</div>" +
        "</div>"
    );

    const waBtn = document.getElementById("pv-outreach-whatsapp");
    if (waBtn) {
      waBtn.addEventListener("click", () => {
        const text = document.getElementById("pv-outreach-msg").value;
        const digits = (contact.mobile || "").replace(/\D/g, "");
        const waNumber = digits.length === 10 ? "91" + digits : digits;
        window.open("https://wa.me/" + waNumber + "?text=" + encodeURIComponent(text), "_blank");
      });
    }

    const emailBtn = document.getElementById("pv-outreach-email");
    if (emailBtn) {
      emailBtn.addEventListener("click", () => {
        const text = document.getElementById("pv-outreach-msg").value;
        const subject = "Complete your Jain Vivah profile for verification";
        window.location.href = "mailto:" + encodeURIComponent(contact.email) + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(text);
      });
    }
  }

  async function renderInterestSection(session, targetId, targetProfile, viewerIsAdmin) {
    const el = document.getElementById("pv-interest-section");
    const myId = session.user.id;

    if (viewerIsAdmin) {
      const contact = await renderContactAndBiodata(targetId, targetProfile, '<div class="mt-reassurance">Admin view — full contact details and bio-data shown regardless of interest status.</div>');
      renderAdminOutreach(targetProfile, contact);
      return;
    }

    const { data: existing } = await supabaseClient
      .from("mt_interests")
      .select("*")
      .or("and(sender_id.eq." + myId + ",receiver_id.eq." + targetId + "),and(sender_id.eq." + targetId + ",receiver_id.eq." + myId + ")")
      .maybeSingle();

    async function sendInterest() {
      const message = document.getElementById("pv-interest-message");
      const { error } = await supabaseClient.from("mt_interests").insert({
        sender_id: myId,
        receiver_id: targetId,
        message: (message && message.value.trim()) || null
      });
      if (error) {
        toast(friendlyInterestError(error.message), "error");
        return;
      }
      toast("Interest sent.", "success");
      renderInterestSection(session, targetId, targetProfile);
    }

    async function updateStatus(id, status, confirmMsg) {
      if (confirmMsg && !confirm(confirmMsg)) return;
      const { error } = await supabaseClient.from("mt_interests").update({ status: status }).eq("id", id);
      if (error) {
        toast(error.message, "error");
        return;
      }
      toast(
        status === "accepted" ? "Interest accepted — contact details unlocked." :
        status === "declined" ? "Interest declined." :
        "Interest withdrawn.",
        "success"
      );
      renderInterestSection(session, targetId, targetProfile);
    }

    if (!existing) {
      el.innerHTML =
        '<div class="mt-card">' +
        '<div class="mt-field"><label for="pv-interest-message">Add a short message (optional)</label>' +
        '<textarea id="pv-interest-message" rows="2"></textarea></div>' +
        '<button type="button" class="mt-btn mt-btn-primary" id="pv-send-interest-btn">Send Interest</button>' +
        "</div>";
      document.getElementById("pv-send-interest-btn").addEventListener("click", sendInterest);
      return;
    }

    if (existing.status === "pending" && existing.sender_id === myId) {
      el.innerHTML =
        '<div class="mt-reassurance">Interest sent — waiting for their response.</div>' +
        '<button type="button" class="mt-btn mt-btn-outline" id="pv-withdraw-btn">Withdraw Interest</button>';
      document.getElementById("pv-withdraw-btn").addEventListener("click", () =>
        updateStatus(existing.id, "withdrawn", "Withdraw this interest?")
      );
      return;
    }

    if (existing.status === "pending" && existing.receiver_id === myId) {
      el.innerHTML =
        '<div class="mt-reassurance">This member is interested in you' +
        (existing.message ? ': "' + escapeHtml(existing.message) + '"' : ".") +
        "</div>" +
        '<div class="pv-interest-actions">' +
        '<button type="button" class="mt-btn mt-btn-primary" id="pv-accept-btn">Accept</button>' +
        '<button type="button" class="mt-btn mt-btn-outline" id="pv-decline-btn">Decline</button>' +
        "</div>";
      document.getElementById("pv-accept-btn").addEventListener("click", () => updateStatus(existing.id, "accepted"));
      document.getElementById("pv-decline-btn").addEventListener("click", () =>
        updateStatus(existing.id, "declined", "Decline this interest? You won't be able to reconsider for a while.")
      );
      return;
    }

    if (existing.status === "accepted") {
      await renderContactAndBiodata(targetId, targetProfile, '<div class="mt-reassurance">🎉 You\'re connected! Contact details are shared below.</div>');
      return;
    }

    if (existing.status === "declined") {
      el.innerHTML =
        '<div class="mt-hint mt-center">' +
        (existing.sender_id === myId
          ? "This member declined your interest."
          : "You declined this member's interest.") +
        "</div>";
      return;
    }

    if (existing.status === "withdrawn") {
      el.innerHTML =
        '<div class="mt-hint mt-center">' +
        (existing.sender_id === myId
          ? "You withdrew your interest."
          : "This member withdrew their interest.") +
        "</div>";
      return;
    }
  }

  // Safety net: this page must never sit on "Loading profile..." forever.
  // If anything hangs (a stuck network call, a stale/expired session token
  // silently retrying) or throws, show a clear retry message instead of a
  // silent infinite spinner - found live 25 Sep 2026 when this page hung
  // indefinitely after a successful mt_contacts check, with the next
  // expected request never even appearing in the network panel.
  (async () => {
    const TIMEOUT_MS = 15000;
    try {
      await Promise.race([
        loadProfileView(),
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error("This is taking longer than expected. Please check your connection and try again.")), TIMEOUT_MS)
        )
      ]);
    } catch (err) {
      const contentEl = document.getElementById("pv-content");
      contentEl.innerHTML =
        '<p class="pv-notfound">' + escapeHtml((err && err.message) || "Something went wrong loading this profile.") + "</p>" +
        '<p class="mt-center"><a href="#" onclick="location.reload(); return false;">Try again</a></p>';
    }
  })();
</script>

</body>
</html>
